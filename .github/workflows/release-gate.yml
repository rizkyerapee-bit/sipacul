name: Release gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore backend/SiPacul.slnx

      - name: Test backend in Release
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=1;Database=sipacul_ci;Username=sipacul_ci;Password=sipacul_ci;Timeout=1;Command Timeout=1;Pooling=false"
        run: dotnet test backend/SiPacul.slnx --configuration Release --no-restore --nologo

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend once
        working-directory: frontend
        run: npm run test:run

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  container:
    name: Container build and stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build images and smoke production stack
        shell: pwsh
        run: ./operations/Test-SiPaculContainerReleaseGate-PS51.ps1
