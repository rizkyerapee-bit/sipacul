upstream sipacul_api {
    server api:8080;
    keepalive 16;
}

upstream sipacul_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 8443 ssl default_server;
    server_name ${SIPACUL_PUBLIC_HOSTNAME};
    server_tokens off;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SiPaculTLS:10m;
    include /etc/nginx/snippets/sipacul-hsts.conf;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";

    location = /api/v1 {
        proxy_pass http://sipacul_api;
    }

    location ^~ /api/v1/ {
        proxy_pass http://sipacul_api;
    }

    location / {
        proxy_pass http://sipacul_frontend;
    }
}
